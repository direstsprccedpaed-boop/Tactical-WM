name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: world-monitor-tactical/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('world-monitor-tactical/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: world-monitor-tactical
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: world-monitor-tactical
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: world-monitor-tactical/dist
          retention-days: 7
